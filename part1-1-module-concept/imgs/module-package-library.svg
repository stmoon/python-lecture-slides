<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <!-- library: what gets installed and distributed as one unit -->
  <rect x="14" y="14" width="872" height="452" rx="26" fill="#f8fafc" stroke="#a855f7" stroke-width="3"/>
  <text x="44" y="58" font-size="31" font-weight="700" fill="#7c3aed">LIBRARY</text>
  <text x="180" y="58" font-size="28" fill="#475569">installed and distributed as one unit</text>

  <!-- package: a directory that groups modules -->
  <rect x="44" y="82" width="396" height="290" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="70" y="122" font-size="29" font-weight="700" fill="#1d4ed8">PACKAGE</text>
  <text x="212" y="122" font-size="28" font-family="monospace" fill="#1d4ed8">sensorkit/</text>
  <rect x="70" y="140" width="344" height="58" rx="11" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="92" y="178" font-size="28" font-family="monospace" fill="#0f172a">__init__.py</text>
  <rect x="70" y="208" width="344" height="58" rx="11" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="92" y="246" font-size="28" font-family="monospace" fill="#0f172a">io.py</text>
  <rect x="70" y="276" width="344" height="58" rx="11" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="92" y="314" font-size="28" font-family="monospace" fill="#0f172a">filters.py</text>

  <rect x="460" y="82" width="396" height="222" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  <text x="486" y="122" font-size="29" font-weight="700" fill="#1d4ed8">PACKAGE</text>
  <text x="628" y="122" font-size="28" font-family="monospace" fill="#1d4ed8">utils/</text>
  <rect x="486" y="140" width="344" height="58" rx="11" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="508" y="178" font-size="28" font-family="monospace" fill="#0f172a">__init__.py</text>
  <rect x="486" y="208" width="344" height="58" rx="11" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="508" y="246" font-size="28" font-family="monospace" fill="#0f172a">timeaxis.py</text>

  <!-- a module can also sit outside any package -->
  <rect x="460" y="316" width="396" height="58" rx="11" fill="#ffffff" stroke="#22c55e" stroke-width="3"/>
  <text x="484" y="354" font-size="28" font-family="monospace" fill="#0f172a">version.py</text>

  <text x="44" y="418" font-size="28" fill="#1d4ed8">MODULE = one .py file</text>
  <text x="460" y="418" font-size="28" fill="#16a34a">a module can stand alone</text>
</svg>
